# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "428f3d88064e44c926da9dbde635d831"
name = "Estimated Delivery Date"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions,read_themes,write_themes,read_orders,write_checkouts"
optional_scopes = [ "read_markets" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[webhooks]
api_version = "2026-10"

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "/api/widget"
subpath = "delivery-date"
prefix = "apps"

[shop.metafields.app.embed_enabled]
type = "boolean"
name = "App embed enabled"
description = "Whether the Estimated Delivery Date app embed is enabled on the live theme"

  [shop.metafields.app.embed_enabled.access]
  admin = "merchant_read"
  storefront = "public_read"

[shop.metafields.app.checkout_widget]
type = "json"
name = "Checkout delivery widget"
description = "Public checkout widget configuration used by the Checkout UI extension"

  [shop.metafields.app.checkout_widget.access]
  admin = "merchant_read"
  storefront = "public_read"
